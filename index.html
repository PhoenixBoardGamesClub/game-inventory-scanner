<!DOCTYPE html>
<html>
<head>

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Game Inventory</title>

  <link rel="apple-touch-icon" href="icon2.png">
  <meta name="apple-mobile-web-app-title" content="J's Game Library">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      margin-bottom: 25px;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 400px;
      margin: auto;
    }

    button {
      font-size: 22px;
      font-weight: bold;
      padding: 18px;
      border: none;
      border-radius: 12px;
      background: white;
      box-shadow: 0 2px 6px rgba(0,0,0,.2);
      cursor: pointer;
    }

    #scanner {
      display: none;
      max-width: 500px;
      margin: auto;
    }

    #reader {
      width: 100%;
    }

    #status {
      font-size: 20px;
      font-weight: bold;
      margin: 20px 0;
      white-space: pre-line;
    }

    #backButton {
      margin-top: 15px;
    }


    /* =============================
       BROWSE GAMES
    ============================= */

    #browseScreen {
      display: none;
      max-width: 600px;
      margin: auto;
      text-align: left;
    }

    #browseScreen h2 {
      text-align: center;
      margin-bottom: 15px;
    }

    #searchBox {
      box-sizing: border-box;
      width: 100%;
      font-size: 18px;
      padding: 14px 16px;
      border: 1px solid #ccc;
      border-radius: 12px;
      margin-bottom: 12px;
      background: white;
    }

    #browseCount {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin: 4px 0 15px;
    }

    #browseLoading {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      padding: 30px 10px;
    }

    #gameList {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .browseGame {
      background: white;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,.12);
      cursor: pointer;
    }

    .browseGame:active {
      transform: scale(.99);
    }

    .browseGameName {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .browseGameMeta {
      color: #555;
      font-size: 15px;
      line-height: 1.6;
    }

    .browseStatusAvailable {
      color: #188038;
      font-weight: bold;
    }

    .browseStatusUnavailable {
      color: #d93025;
      font-weight: bold;
    }

    #browseBackButton {
      width: 100%;
      margin-top: 20px;
    }

    #noGames {
      display: none;
      text-align: center;
      background: white;
      border-radius: 14px;
      padding: 25px;
      color: #666;
    }


    /* =============================
       GAME DETAILS CARD
    ============================= */

    #gameCard {
      display: none;
      max-width: 500px;
      margin: 20px auto 0;
      text-align: left;
      background: white;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }

    #gameCard h2 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 5px;
      font-size: 28px;
    }

    .scanId {
      text-align: center;
      color: #777;
      margin-bottom: 20px;
    }

    .detailSection {
      border-top: 1px solid #ddd;
      padding-top: 14px;
      margin-top: 14px;
    }

    .detailSection h3 {
      margin: 0 0 10px;
      font-size: 17px;
    }

    .detailRow {
      margin: 7px 0;
      line-height: 1.4;
    }

    .detailLabel {
      font-weight: bold;
    }

    .available {
      font-weight: bold;
      color: #188038;
    }

    .unavailable {
      font-weight: bold;
      color: #d93025;
    }

    #detailsBackButton {
      margin-top: 20px;
      width: 100%;
    }

  </style>

</head>


<body>

<h1>🎲 Game Inventory</h1>


<!-- =============================
     MAIN MENU
============================= -->

<div id="menu" class="menu">

  <button onclick="startBrowse()">
    📚 BROWSE GAMES
  </button>

  <button onclick="startLoan()">
    🎲 LOAN GAME
  </button>

  <button onclick="startReturn()">
    ↩️ RETURN GAME
  </button>

  <button onclick="startMove()">
    📦 MOVE GAME
  </button>

  <button onclick="startDetails()">
    🔎 GAME DETAILS
  </button>

</div>


<!-- =============================
     BROWSE GAMES
============================= -->

<div id="browseScreen">

  <h2>📚 Browse Games</h2>

  <input
    id="searchBox"
    type="search"
    placeholder="🔍 Search games..."
    autocomplete="off"
    oninput="filterBrowseGames()"
  >

  <div id="browseCount"></div>

  <div id="browseLoading">
    Loading game library...
  </div>

  <div id="noGames">
    No games match your search.
  </div>

  <div id="gameList"></div>

  <button id="browseBackButton"
          onclick="returnToMenu()">
    ← Back
  </button>

</div>


<!-- =============================
     SCANNER
============================= -->

<div id="scanner">

  <div id="status">
    Ready
  </div>

  <div id="reader"></div>

  <button id="backButton"
          onclick="returnToMenu()">
    ← Back
  </button>

</div>


<!-- =============================
     GAME DETAILS CARD
============================= -->

<div id="gameCard">

  <h2 id="detailGameName"></h2>

  <div id="detailScanId"
       class="scanId"></div>


  <div class="detailSection">

    <h3>📍 Availability</h3>

    <div class="detailRow">
      <span class="detailLabel">Status:</span>
      <span id="detailStatus"></span>
    </div>

    <div class="detailRow">
      <span class="detailLabel">Location:</span>
      <span id="detailLocation"></span>
    </div>

    <div id="loanInfo"></div>

  </div>


  <div class="detailSection">

    <h3>🎲 Game Info</h3>

    <div class="detailRow">
      <span class="detailLabel">Theme:</span>
      <span id="detailTheme"></span>
    </div>

    <div class="detailRow">
      <span class="detailLabel">Type:</span>
      <span id="detailType"></span>
    </div>

    <div class="detailRow">
      <span class="detailLabel">Style:</span>
      <span id="detailStyle"></span>
    </div>

    <div class="detailRow">
      <span class="detailLabel">Weight:</span>
      <span id="detailWeight"></span>
    </div>

  </div>


  <div class="detailSection">

    <h3>👥 Players</h3>

    <div class="detailRow">
      <span id="detailPlayers"></span>
    </div>

    <div class="detailRow">
      <span class="detailLabel">Ideal:</span>
      <span id="detailIdeal"></span>
    </div>

  </div>


  <div class="detailSection">

    <h3>⏱️ Play Time</h3>

    <div class="detailRow">
      <span id="detailTime"></span>
    </div>

  </div>


  <button id="detailsBackButton"
          onclick="detailsBack()">
    ← Back
  </button>

</div>



<script>

const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbwzBXdBwvCzdNhyhE13W7XH0FkgrhwrMngF_fO3oylFuRgwJg1zjnFiGIJJk-pkY7YblA/exec";


let mode = "";
let step = 1;
let scanner = null;
let processing = false;

let gameCatalog = [];
let detailsSource = "";


/* =============================
   BROWSE GAMES
============================= */

function startBrowse() {

  mode = "browse";

  document.getElementById("menu").style.display =
    "none";

  document.getElementById("scanner").style.display =
    "none";

  document.getElementById("gameCard").style.display =
    "none";

  document.getElementById("browseScreen").style.display =
    "block";

  document.getElementById("searchBox").value =
    "";

  if (gameCatalog.length > 0) {

    renderBrowseGames(gameCatalog);
    return;
  }

  document.getElementById("browseLoading").style.display =
    "block";

  document.getElementById("gameList").innerHTML =
    "";

  document.getElementById("browseCount").innerText =
    "";

  loadCatalog();
}


/* -----------------------------
   LOAD CATALOG
----------------------------- */

function loadCatalog() {

  const callbackName =
    "catalogCallback_" + Date.now();

  window[callbackName] = function(result) {

    try {

      if (!result.success) {
        throw new Error(
          result.message || "Could not load game catalog."
        );
      }

      gameCatalog =
        result.games || [];

      document.getElementById("browseLoading").style.display =
        "none";

      renderBrowseGames(gameCatalog);

    }

    catch(error) {

      document.getElementById("browseLoading").innerText =
        "❌ " + error.message;

    }

    finally {

      delete window[callbackName];

      const script =
        document.getElementById(callbackName);

      if (script) {
        script.remove();
      }
    }
  };


  const url =
    SCRIPT_URL +
    "?mode=catalog" +
    "&callback=" + encodeURIComponent(callbackName);


  const script =
    document.createElement("script");

  script.id =
    callbackName;

  script.src =
    url;


  script.onerror = function() {

    document.getElementById("browseLoading").innerText =
      "❌ Could not connect to inventory system.";

    delete window[callbackName];

    script.remove();
  };


  document.body.appendChild(script);
}


/* -----------------------------
   FILTER BROWSE GAMES
----------------------------- */

function filterBrowseGames() {

  const search =
    document
      .getElementById("searchBox")
      .value
      .trim()
      .toLowerCase();

  if (!search) {
    renderBrowseGames(gameCatalog);
    return;
  }

  const filtered =
    gameCatalog.filter(game => {

      return (
        String(game.gameName || "")
          .toLowerCase()
          .includes(search)
        ||
        String(game.theme || "")
          .toLowerCase()
          .includes(search)
        ||
        String(game.gameType || "")
          .toLowerCase()
          .includes(search)
        ||
        String(game.style || "")
          .toLowerCase()
          .includes(search)
      );
    });

  renderBrowseGames(filtered);
}


/* -----------------------------
   RENDER BROWSE LIST
----------------------------- */

function renderBrowseGames(games) {

  const list =
    document.getElementById("gameList");

  const noGames =
    document.getElementById("noGames");

  list.innerHTML =
    "";

  document.getElementById("browseCount").innerText =
    games.length +
    (games.length === 1 ? " game" : " games");


  if (games.length === 0) {

    noGames.style.display =
      "block";

    return;
  }

  noGames.style.display =
    "none";


  games.forEach(game => {

    const card =
      document.createElement("div");

    card.className =
      "browseGame";

    card.onclick = function() {
      openBrowseGame(game);
    };


    const name =
      document.createElement("div");

    name.className =
      "browseGameName";

    name.innerText =
      game.gameName || "Unknown Game";


    const meta =
      document.createElement("div");

    meta.className =
      "browseGameMeta";


    const availability =
      document.createElement("div");

    const status =
      document.createElement("span");

    status.className =
      game.status === "Available"
        ? "browseStatusAvailable"
        : "browseStatusUnavailable";

    status.innerText =
      game.status === "Available"
        ? "🟢 Available"
        : "🔴 " + (game.status || "Unavailable");

    availability.appendChild(status);


    if (game.location) {

      availability.appendChild(
        document.createTextNode(
          " · " + game.location
        )
      );
    }


    const stats =
      document.createElement("div");

    stats.innerText =
      "👥 " +
      formatPlayersShort(
        game.minPlayers,
        game.maxPlayers
      ) +
      "   ·   ⏱️ " +
      formatTimeShort(
        game.avgTime
      );


    meta.appendChild(
      availability
    );

    meta.appendChild(
      stats
    );


    card.appendChild(
      name
    );

    card.appendChild(
      meta
    );

    list.appendChild(
      card
    );
  });
}


/* -----------------------------
   OPEN GAME FROM BROWSE
----------------------------- */

function openBrowseGame(game) {

  detailsSource =
    "browse";

  document.getElementById("browseScreen").style.display =
    "none";

  document.getElementById("gameCard").style.display =
    "none";

  displayGameDetails(game);
}


/* -----------------------------
   SHORT PLAYER DISPLAY
----------------------------- */

function formatPlayersShort(min, max) {

  if (!min && !max) {
    return "—";
  }

  if (min == max) {
    return String(min);
  }

  return min + "–" + max;
}


/* -----------------------------
   SHORT TIME DISPLAY
----------------------------- */

function formatTimeShort(time) {

  if (!time) {
    return "—";
  }

  return "~" + time + " min";
}


/* =============================
   LOAN
============================= */

function startLoan() {

  mode = "loan";
  step = 1;

  showScanner(
    "Scan the PERSON who is borrowing the game."
  );
}


/* =============================
   RETURN
============================= */

function startReturn() {

  mode = "return";
  step = 1;

  showScanner(
    "Scan the GAME being returned."
  );
}


/* =============================
   MOVE
============================= */

function startMove() {

  mode = "move";
  step = 1;

  showScanner(
    "Scan the GAME you are moving."
  );
}


/* =============================
   DETAILS
============================= */

function startDetails() {

  mode = "details";
  step = 1;

  detailsSource =
    "scanner";

  showScanner(
    "Scan the GAME to view details."
  );
}


/* =============================
   SHOW SCANNER
============================= */

function showScanner(message) {

  document.getElementById("menu").style.display =
    "none";

  document.getElementById("browseScreen").style.display =
    "none";

  document.getElementById("gameCard").style.display =
    "none";

  document.getElementById("scanner").style.display =
    "block";

  document.getElementById("status").innerText =
    message;

  startCamera();
}


/* =============================
   START CAMERA
============================= */

async function startCamera() {

  try {

    scanner =
      new Html5Qrcode("reader");

    await scanner.start(

      { facingMode: "environment" },

      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },

      onScanSuccess,

      onScanFailure
    );

  }

  catch(error) {

    document.getElementById("status").innerText =
      "❌ Camera could not start.\n\n" +
      error;
  }
}


/* =============================
   QR SCANNED
============================= */

function onScanSuccess(decodedText) {

  if (processing) {
    return;
  }

  processing =
    true;

  document.getElementById("status").innerText =
    "Processing " + decodedText + "...";


  const callbackName =
    "scanCallback_" + Date.now();


  window[callbackName] =
    async function(result) {

      try {

        if (!result.success) {

          document.getElementById("status").innerText =
            "❌ " + result.message;

          processing =
            false;

          return;
        }


        /* DETAILS */

        if (mode === "details") {

          await stopCamera();

          document.getElementById("scanner").style.display =
            "none";

          displayGameDetails(
            result.game
          );
        }


        /* LOAN */

        else if (mode === "loan") {

          if (result.nextStep === 2) {

            step =
              2;

            document.getElementById("status").innerText =
              "✅ Person accepted.\n\n" +
              "Scan the GAME.";

          }

          else {

            document.getElementById("status").innerText =
              "✅ Loan completed.";

            await stopCamera();
          }
        }


        /* RETURN */

        else if (mode === "return") {

          document.getElementById("status").innerText =
            "✅ Game returned.";

          await stopCamera();
        }


        /* MOVE */

        else if (mode === "move") {

          if (result.nextStep === 2) {

            step =
              2;

            document.getElementById("status").innerText =
              "✅ Game accepted.\n\n" +
              "Scan the NEW LOCATION.";

          }

          else {

            document.getElementById("status").innerText =
              "✅ Game moved.";

            await stopCamera();
          }
        }

      }

      catch(error) {

        document.getElementById("status").innerText =
          "❌ " + error;

      }

      finally {

        processing =
          false;

        delete window[callbackName];

        const script =
          document.getElementById(callbackName);

        if (script) {
          script.remove();
        }
      }
    };


  const url =
    SCRIPT_URL +
    "?scanId=" + encodeURIComponent(decodedText) +
    "&mode=" + encodeURIComponent(mode) +
    "&step=" + encodeURIComponent(step) +
    "&callback=" + encodeURIComponent(callbackName);


  const script =
    document.createElement("script");

  script.id =
    callbackName;

  script.src =
    url;


  script.onerror =
    function() {

      document.getElementById("status").innerText =
        "❌ Could not connect to inventory system.";

      processing =
        false;

      delete window[callbackName];

      script.remove();
    };


  document.body.appendChild(
    script
  );
}


/* =============================
   DISPLAY GAME DETAILS
============================= */

function displayGameDetails(game) {

  document.getElementById("gameCard").style.display =
    "block";


  document.getElementById("detailGameName").innerText =
    game.gameName || "Unknown Game";


  document.getElementById("detailScanId").innerText =
    game.scanId || "";


  const statusElement =
    document.getElementById("detailStatus");

  statusElement.innerText =
    game.status || "Unknown";

  statusElement.className =
    game.status === "Available"
      ? "available"
      : "unavailable";


  document.getElementById("detailLocation").innerText =
    game.location || "Not assigned";


  /* LOAN INFORMATION */

  const loanInfo =
    document.getElementById("loanInfo");

  loanInfo.innerHTML =
    "";


  if (game.status === "Loaned") {

    if (game.borrower) {

      const borrowerRow =
        document.createElement("div");

      borrowerRow.className =
        "detailRow";

      borrowerRow.innerHTML =
        '<span class="detailLabel">Borrower:</span> ' +
        escapeHtml(game.borrower);

      loanInfo.appendChild(
        borrowerRow
      );
    }


    if (game.expectedReturn) {

      const returnRow =
        document.createElement("div");

      returnRow.className =
        "detailRow";

      returnRow.innerHTML =
        '<span class="detailLabel">Expected Return:</span> ' +
        escapeHtml(game.expectedReturn);

      loanInfo.appendChild(
        returnRow
      );
    }
  }


  /* GAME INFORMATION */

  document.getElementById("detailTheme").innerText =
    game.theme || "—";

  document.getElementById("detailType").innerText =
    game.gameType || "—";

  document.getElementById("detailStyle").innerText =
    game.style || "—";

  document.getElementById("detailWeight").innerText =
    formatWeight(
      game.weight
    );


  /* PLAYERS */

  document.getElementById("detailPlayers").innerText =
    formatPlayers(
      game.minPlayers,
      game.maxPlayers
    );

  document.getElementById("detailIdeal").innerText =
    game.idealPlayers
      ? game.idealPlayers + " players"
      : "—";


  /* PLAY TIME */

  document.getElementById("detailTime").innerText =
    game.avgTime
      ? "~" + game.avgTime + " minutes"
      : "—";
}


/* =============================
   DETAILS BACK
============================= */

function detailsBack() {

  document.getElementById("gameCard").style.display =
    "none";


  if (detailsSource === "browse") {

    document.getElementById("browseScreen").style.display =
      "block";

    return;
  }


  returnToMenu();
}


/* =============================
   FORMAT WEIGHT
============================= */

function formatWeight(weight) {

  const value =
    Number(weight);

  if (!value) {
    return "—";
  }


  const names = {
    1: "Very Light",
    2: "Light",
    3: "Medium",
    4: "Heavy",
    5: "Very Heavy"
  };


  const filled =
    "●".repeat(value);

  const empty =
    "○".repeat(5 - value);


  return (
    filled +
    empty +
    "  " +
    value +
    "/5 — " +
    names[value]
  );
}


/* =============================
   FORMAT PLAYERS
============================= */

function formatPlayers(min, max) {

  if (!min && !max) {
    return "—";
  }

  if (min == max) {
    return min + " players";
  }

  return min + "–" + max + " players";
}


/* =============================
   ESCAPE HTML
============================= */

function escapeHtml(value) {

  const div =
    document.createElement("div");

  div.innerText =
    value || "";

  return div.innerHTML;
}


/* =============================
   NORMAL QR FAILURE
============================= */

function onScanFailure(error) {
  // Ignore normal scanning failures.
}


/* =============================
   STOP CAMERA
============================= */

async function stopCamera() {

  if (!scanner) {
    return;
  }

  try {

    await scanner.stop();

    scanner.clear();

  }

  catch(error) {

    console.log(error);
  }

  scanner =
    null;
}


/* =============================
   RETURN TO MENU
============================= */

async function returnToMenu() {

  await stopCamera();

  document.getElementById("scanner").style.display =
    "none";

  document.getElementById("gameCard").style.display =
    "none";

  document.getElementById("browseScreen").style.display =
    "none";

  document.getElementById("menu").style.display =
    "flex";

  mode =
    "";

  step =
    1;

  processing =
    false;

  detailsSource =
    "";
}

</script>

</body>
</html>
